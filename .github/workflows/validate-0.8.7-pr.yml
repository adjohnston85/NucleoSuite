name: Validate NucleoSuite 0.8.7 PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Finalize version assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_cli.py')
          text = p.read_text()
          text = text.replace('assert __version__ == "0.8.6"', 'assert __version__ == "0.8.7"')
          p.write_text(text)
          PY
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest
      - name: Build distributions
        run: |
          rm -rf dist build *.egg-info src/*.egg-info
          python -m build
      - name: Verify release
        run: |
          python - <<'PY'
          import nucleosuite
          assert nucleosuite.__version__ == '0.8.7'
          PY
          python -m pip install --force-reinstall --no-deps dist/nucleosuite-0.8.7-py3-none-any.whl
          nucleosuite --version | tail -n 1 | grep -F 'nucleosuite 0.8.7'
          nucleosuite aggregate --help | grep -F -- '--category-col'
      - name: Assemble full rebuild
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/NucleoSuite-0.8.7/dist
          rsync -a ./ release/NucleoSuite-0.8.7/ --exclude .git --exclude .github --exclude release --exclude build --exclude '*.egg-info' --exclude 'src/*.egg-info'
          cp dist/nucleosuite-0.8.7-py3-none-any.whl release/NucleoSuite-0.8.7/dist/
          cp dist/nucleosuite-0.8.7.tar.gz release/NucleoSuite-0.8.7/dist/
          (cd release && zip -qr NucleoSuite-0.8.7-full-rebuild.zip NucleoSuite-0.8.7)
          (cd release && sha256sum NucleoSuite-0.8.7-full-rebuild.zip NucleoSuite-0.8.7/dist/nucleosuite-0.8.7-py3-none-any.whl NucleoSuite-0.8.7/dist/nucleosuite-0.8.7.tar.gz > NucleoSuite_0.8.7_SHA256SUMS.txt)
      - name: Persist validated assertion
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_cli.py
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize 0.8.7 version assertion [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload full rebuild
        uses: actions/upload-artifact@v4
        with:
          name: NucleoSuite-0.8.7-full-rebuild
          path: |
            release/NucleoSuite-0.8.7-full-rebuild.zip
            release/NucleoSuite_0.8.7_SHA256SUMS.txt
            dist/nucleosuite-0.8.7-py3-none-any.whl
            dist/nucleosuite-0.8.7.tar.gz
          if-no-files-found: error
